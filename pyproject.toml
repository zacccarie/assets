[project]
name = "latent-flow"
version = "0.1.0"
description = "Experimental research platform: analyzing video as a trajectory in a latent state space"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Heavy / GPU dependencies are optional so the skeleton imports cleanly.
# decord is intentionally NOT included: no Apple-Silicon wheels. PyAV alone
# is enough for the current ingestion path.
ingest = ["av>=11.0"]
encoders = ["torch>=2.1", "timm>=0.9"]
geometry = ["scikit-learn>=1.3", "umap-learn>=0.5"]
viz = ["matplotlib>=3.7"]
all = [
    "av>=11.0",
    "torch>=2.1", "timm>=0.9",
    "scikit-learn>=1.3", "umap-learn>=0.5",
    "matplotlib>=3.7",
    "pillow>=10.0",
]

[project.scripts]
latent-flow = "latent_flow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["latent_flow*"]
